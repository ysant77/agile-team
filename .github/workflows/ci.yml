name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax check
        run: |
          files=$(git ls-files '*.js' '*.mjs')
          for f in $files; do node --check "$f"; done
      - name: Tests
        run: npm test --if-present

  # Every commit of a pull request is scanned (full history), so a unit cannot carry a secret in
  # an earlier commit that a later one removed.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One check to require in the ruleset. It runs always, also when a job before it failed or was
  # skipped, and fails unless every other job succeeded. A job skipped by its own "if" (for
  # example "if: false") is then a failure, not a pass.
  # Limit: this job is in the same file, so a pull request that edits this file can also change or
  # skip the gate; GitHub reports a skipped required check as passed. Review every change to
  # .github/workflows/ by hand.
  gate:
    if: ${{ always() }}
    needs: [test, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "job results: $RESULTS"
          if [ "$(echo "$RESULTS" | jq -r 'map(select(. != "success")) | length')" != 0 ]; then
            echo "::error::every job must succeed"; exit 1
          fi
