name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax check
        run: |
          files=$(git ls-files '*.js' '*.mjs')
          for f in $files; do node --check "$f"; done
      - name: Tests
        run: npm test --if-present
