modules:
  rovo:agent:
    - key: pm-agent
      name: Agile PM
      description: Turns a request into a Jira ticket with story points, after the
        user confirms.
      prompt: >
        You are the product manager and scrum master of a small software team.

        When the user asks for a ticket, write a one-line summary and a
        description with acceptance criteria as checkable statements. Propose a
        story point value from 1, 2, 3, 5, 8 or 13. Show the draft and ask the
        user to confirm before you call the create-ticket action. Never create a
        ticket without confirmation.

        Pass acceptance criteria to create-ticket as lines "AC1 | statement |
        check". Use test_passes(test_KEY_name) for behaviour a test can prove,
        with KEY the project key and number without the dash, for example
        test_BANK12_send_button. Use manual() when only a human can judge it.

        You can read the latest commit of a public GitHub repository with the
        read-github-commit action.
      conversationStarters:
        - Create a ticket for a small bug
      actions:
        - create-ticket
        - read-github-commit
    - key: lead-agent
      name: Agile Team Lead
      description: Explains evidence from the code host. It never changes tickets.
      prompt: >
        You are the team lead. You explain evidence. You never create, edit or
        close tickets. When the user asks about a repository, call the
        read-github-commit action and report the commit id, author date and
        message exactly as returned. If the action fails, say that the evidence
        cannot be verified.
      conversationStarters:
        - Show the latest commit of octocat/Hello-World
      actions:
        - read-github-commit
  action:
    - key: create-ticket
      name: Create ticket with story points
      function: createTicket
      actionVerb: CREATE
      description: >
        Creates a Jira work item in the given project with a summary, a
        description and a story point value. Call it only after the user has
        confirmed the draft.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: The Jira project key, for example BANK.
        summary:
          title: Summary
          type: string
          required: true
          description: One-line summary of the work item.
        description:
          title: Description
          type: string
          required: true
          description: Description with acceptance criteria.
        storyPoints:
          title: Story points
          type: number
          required: true
          description: One of 1, 2, 3, 5, 8, 13.
        acceptanceCriteria:
          title: Acceptance criteria
          type: string
          required: false
          description: >
            One line per criterion, "AC1 | statement | check", where check is one of
            test_passes(test_name), metric_at_least(name, value), metric_at_most(name, value),
            subtasks_done(), deployed(tag) or manual().
        issueType:
          title: Work type
          type: string
          required: false
          description: Task, Story or Bug. Default Task.
    - key: read-github-commit
      name: Read latest GitHub commit
      function: readGithubCommit
      actionVerb: GET
      description: >
        Reads the latest commit of a public GitHub repository and returns its
        id, author date and message.
      inputs:
        repository:
          title: Repository
          type: string
          required: false
          description: owner/name, for example octocat/Hello-World.
  trigger:
    - key: comment-claim-trigger
      function: onComment
      events:
        - avi:jira:commented:issue
  consumer:
    - key: verify-consumer
      queue: verify-queue
      function: verifyConsumer
  function:
    - key: verifyConsumer
      handler: consumer.handler
      timeoutSeconds: 300
    - key: createTicket
      handler: index.createTicket
    - key: readGithubCommit
      handler: index.readGithubCommit
    - key: onComment
      handler: index.onComment
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:project:jira
    - read:board-scope:jira-software
    - read:board-scope.admin:jira-software
    - storage:app
  external:
    fetch:
      backend:
        - address: api.github.com
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/4b780e9f-9320-4f5f-ba47-15272e09a091
